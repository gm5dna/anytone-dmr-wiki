site_name: AnyTone DMR Guide
site_description: Norman Williams' UK guide to the AnyTone AT-D168/868/878/890UV & AT-D578UV, preserved
site_url: https://gm5dna.github.io/anytone-dmr-wiki/
repo_url: https://github.com/gm5dna/anytone-dmr-wiki
edit_uri: edit/main/docs/
theme:
  name: material
  language: en
  features: [navigation.indexes, navigation.top, navigation.footer, navigation.instant, navigation.instant.progress, navigation.path, navigation.prune, toc.follow, search.highlight, search.suggest, content.action.edit, content.tooltips]
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}
plugins:
  - search
  - tags
  - awesome-nav
  - glightbox:
      skip_classes: [twemoji]
  - social:
      enabled: !ENV [SOCIAL_CARDS, false]
hooks:
  - hooks/page_extras.py
exclude_docs: |
  originals/**/*.html
extra_javascript: [javascripts/archive-links.js]
extra_css: [javascripts/archive-links.css]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc
  - sane_lists
  - nl2br
  - pymdownx.highlight
  - pymdownx.superfences
  - abbr
  - pymdownx.snippets:
      auto_append: [includes/abbreviations.md]
